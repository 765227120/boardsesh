name: Custom iOS IPA (tb-board, unsigned)

# Builds an UNSIGNED device IPA of the tb-board fork on a macOS runner.
# No Apple Developer account or signing secrets are needed: the archive is
# produced with code signing disabled, the .app is packed into Payload/ and
# zipped. The user (or a customer) re-signs it when sideloading, e.g.
# Sideloadly / AltStore with a free Apple ID, or a paid team certificate.
#
# The tb-board firmware keeps its own NUS protocol; the app talks to it when
# the connected device is recognised as local (see ble-protocol/aurora.ts).

on:
  push:
    branches: [custom-apk]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a queued/older IPA build (each one is a ~40-min
# macOS job; only the latest commit's artifact matters).
concurrency:
  group: custom-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27 toolchain (Swift 6.2+): macos-15's Xcode 16.4/Swift 6.1 cannot
    # build the ExpoModulesJSI SwiftPM package (tools version 6.2).
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      CI: '1'
      EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
      EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
      EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 401523882502-0f6d7te1vekvkpmg18t8di6l0ig560q7.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 401523882502-h92kdkck1qhmdbgq7ltek87g4rg8rg3h.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 401523882502-hvfhh79p4q1qq0md7lk646c6sgmsi9q0.apps.googleusercontent.com
      EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400
      EXPO_PUBLIC_SNAPSHOT_BASE_URL: https://snapshots.boardsesh.com/board-snapshots/v1-gzip
      EXPO_PUBLIC_USE_RN_FETCH: '1'
      # The archive has no Sentry auth token; keep the upload phase inert.
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.x'
          cache: false

      - name: Install workspace dependencies
        run: vp install --frozen-lockfile

      - name: Write .env for Expo build-time inlining
        working-directory: packages/mobile
        run: |
          cat > .env <<ENV
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EXPO_PUBLIC_SNAPSHOT_BASE_URL=$EXPO_PUBLIC_SNAPSHOT_BASE_URL
          EXPO_PUBLIC_USE_RN_FETCH=$EXPO_PUBLIC_USE_RN_FETCH
          ENV

      - name: Expo prebuild (generate ios/)
        working-directory: packages/mobile
        run: vp exec expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        working-directory: packages/mobile/ios
        run: pod install

      - name: Archive (code signing disabled)
        working-directory: packages/mobile
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/Boardsesh.xcworkspace \
            -scheme Boardsesh \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ios/build/Boardsesh.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee archive.log

      - name: Verify the local-board code is in the bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="packages/mobile/ios/build/Boardsesh.xcarchive/Products/Applications/Boardsesh.app"
          BUNDLE="$(find "$APP" -maxdepth 2 -name '*.jsbundle' -print -quit)"
          if [ -z "$BUNDLE" ]; then
            echo "::error::no .jsbundle found in the archived app"
            exit 1
          fi
          echo "bundle: $BUNDLE"
          python3 - "$BUNDLE" <<'PY'
          import sys
          data = open(sys.argv[1], 'rb').read()
          name = '攀岩'
          count = data.count(name.encode('utf-16-le')) + data.count(name.encode('utf-8'))
          print(f'local-board name occurrences: {count}')
          if count == 0:
              raise SystemExit('tb-board local protocol is not in the bundle')
          PY

      - name: Package unsigned IPA
        working-directory: packages/mobile
        run: |
          set -euo pipefail
          APP="$(find ios/build/Boardsesh.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          echo "app: $APP"
          rm -rf ios/build/ipa
          mkdir -p ios/build/ipa/Payload
          cp -R "$APP" ios/build/ipa/Payload/
          ditto -c -k --sequesterRsrc --keepParent ios/build/ipa/Payload boardsesh-tb-board-unsigned.ipa
          shasum -a 256 boardsesh-tb-board-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tb-board-ios-unsigned-ipa
          path: packages/mobile/boardsesh-tb-board-unsigned.ipa
          if-no-files-found: error